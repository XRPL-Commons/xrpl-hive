name: Integration Tests

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1' # Weekly on Monday at 3am UTC
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.24'

      - name: Build xrpl-hive
        run: make build

      - name: Run smoke tests
        run: ./bin/xrpl-hive --sim smoke --client rippled

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: smoke-results
          path: workspace/logs/

  rpccompat:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.24'

      - name: Build xrpl-hive
        run: make build

      - name: Run RPC compatibility tests
        run: ./bin/xrpl-hive --sim rpccompat --client rippled

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rpccompat-results
          path: workspace/logs/

  rpccompat-stateful:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.24'

      - name: Build xrpl-hive
        run: make build

      - name: Run stateful RPC tests
        run: ./bin/xrpl-hive --sim rpccompat-stateful --client rippled

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rpccompat-stateful-results
          path: workspace/logs/
