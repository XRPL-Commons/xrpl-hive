<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="icon" href="images/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="lib/app.css">
  </head>

  <body>
    <script src="lib/app-suite.js" type="module"></script>
    <main role="main">
      <div id="hive-header">
        <a href="index.html" style="display:flex;align-items:center;gap:0.6rem;text-decoration:none;">
          <img id="hive-logo" height="35" src="images/xrpl-logo-dark.svg">
          <span id="hive-title" style="font-size:1.2rem;font-weight:500;letter-spacing:-0.3px;color:var(--bs-body-color);">hive</span>
        </a>
        <nav id="hive-static-nav">
          <span class="nav-item" id="hive-instance-info"></span>
          <a class="nav-item" href="https://github.com/ethereum/hive/blob/master/docs/overview.md#what-is-hive">What is Hive?</a>
          <span class="nav-item theme-toggle">🌙</span>
        </nav>
      </div>

      <noscript>
        <h3>Please enable JavaScript to use hiveview.</h3>
        <style>.script-content{ display: none; }</style>
      </noscript>

      <div class="script-loaded">
        <div class="row">
          <div class="col-md-7">
            <h2><span id="testsuite_state">Results:</span> <span id="testsuite_name"></span></h2>
            <p><span id="testsuite_desc"></span></p>
            <p><span id="testsuite_clients"></span></p>
          </div>
          <div class="col-md-5">
            <ul id="testsuite_info" class="justify-content-end list-group list-group-horizontal-xl" style="display: none;">
              <li id="testsuite_start" class="list-group-item"></li>
              <li id="testsuite_duration" class="list-group-item"></li>
              <li class="list-group-item"><a id="sim-log-link"></a></li>
            </ul>
          </div>
        </div>

        <div id="load-progress-bar-container" class="progress" style="display: none;">
          <div id="load-progress-bar" class="progress-bar" role="progressbar" style="width: 0" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"></div>
        </div>

        <table id="execresults" class="table table-bordered"></table>
      </div>

      <footer id="hive-footer">
        <span class="xrpl-badge">
          <img id="footer-logo" height="16" src="images/xrpl-logo-dark.svg" alt="XRPL">
          XRPL Hive
        </span>
        <span>Fork of <a href="https://github.com/ethereum/hive" target="_blank" rel="noopener">Ethereum Hive</a> &mdash; kudos to the Ethereum team for building the original testing framework</span>
      </footer>
    </main>
  </body>
</html>
